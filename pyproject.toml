[project]
name = "sar-transformer"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==1.26.4",
    "opencv-python-headless",
    "matplotlib",
    "timm",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true